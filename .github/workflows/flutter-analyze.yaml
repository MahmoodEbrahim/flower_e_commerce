name: Flutter Analyze

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  flutter-analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.22.2'
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze code
        run: flutter analyze