name: Validate PR Title

on:
  pull_request_target:
    types:
      - opened
      - edited
      - reopened
      - synchronize

jobs:
  validate-pr-title:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      statuses: write
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            style
            refactor
            perf
            test
          scopes: "*"
          subjectPattern: '^[a-z]+\(.*\): .+ [A-Z]+-\d+$'
          subjectPatternError: |
            The PR title must follow the format: `type(scope): description PREFIX-123`
            Example: `feat(ui): add login screen ABC-123`
          validateSingleCommit: true
          validateSingleCommitMatchesPrTitle: true
          githubBaseUrl: https://api.github.com
