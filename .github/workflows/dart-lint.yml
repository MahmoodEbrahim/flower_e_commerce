name: Dart Linting

on:
  pull_request:
    branches:
      - main
      - developments
      - master
      - feature/*
  push:
    branches:
      - main
      - developments
      - master
      - feature/*

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Dart
        uses: dart-lang/setup-dart@v2
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Run Dart Linter
        run: dart analyze
